<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Resposive Contact Us Form | UK Coder </title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div class="container">
        <div class="content">
            <div class="left-side">
                <div class="address details">
                    <i class="fas fa-map-marker-alt"></i>
                    <div class="address">Address</div>
                    <div class="text-one">Home no. 15</div>
                    <div class="text-two">Islamabad, Punjab, Pakistan</div>
                </div>

                <div class="phone details">
                    <i class="fas fa-phone"></i>
                    <div class="address">Phone</div>
                    <div class="text-one">+923068478301</div>
                    <div class="text-two">+1 0884 3943 763</div>
                </div>

                <div class="email details">
                    <i class="fas fa-envelope"></i>
                    <div class="address">Email</div>
                    <div class="text-one">uzisolutions@gmail.com</div>
                    <div class="text-two">info.ukcoder@gmail.com</div>
                </div>
            </div>


            <div class="right-side">
                <div class="topic-text">Send us a message</div>
                <p>If you have any work from me or any type of quries related to my coding, you can send me message from
                    here. it's my pleasure to help you</p>
                <form action="#">
                    <div class="input-box">
                        <input type="text" placeholder="Enter your name">
                    </div>
                    <div class="input-box">
                        <input type="text" placeholder="Enter your email">
                    </div>
                    <div class="input-box message-box">
                        <textarea></textarea>
                    </div>
                    <div class="button">
                        <input type="button" value="Send Now">
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
